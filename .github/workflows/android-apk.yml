# Builds the Android APK on every push to main that touches the app (or on demand) and publishes it as the
# "android-latest" release, so it can be installed from:
#   https://github.com/<owner>/<repo>/releases/download/android-latest/elets-salescall-ai.apk
#
# Default server baked into the app: repository variable API_BASE_URL (Settings → Secrets and variables →
# Actions → Variables). Users can still change the server on the sign-in screen.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL != '' && vars.API_BASE_URL || 'http://10.0.0.172:8010' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Pinned so a new Flutter release can't change Gradle/AGP requirements under us. Bump deliberately.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Flutter version
        run: echo "::notice title=Flutter::$(flutter --version | head -n 1)"

      - name: Dependencies
        run: flutter pub get

      # Errors and warnings fail the build; style hints (infos) don't. Problems are re-emitted as annotations
      # so they are readable on the run page and through the API.
      - name: Analyze
        run: |
          if ! flutter analyze --no-fatal-infos > analyze.txt 2>&1; then
            cat analyze.txt
            grep -E "^\s*(error|warning) " analyze.txt | head -n 20 | while IFS= read -r line; do echo "::error title=analyze::$line"; done
            exit 1
          fi
          cat analyze.txt

      - name: Test
        run: flutter test

      - name: Build APK
        run: |
          if ! flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL" > build.txt 2>&1; then
            cat build.txt
            # Surface the cause (Gradle's "What went wrong" block, Dart/Kotlin errors) as annotations.
            { grep -A6 "What went wrong" build.txt; grep -E "^e: |Error: |error:|FAILURE:" build.txt; } \
              | grep -v '^--$' | head -n 25 | while IFS= read -r line; do echo "::error title=build::$line"; done
            exit 1
          fi
          tail -n 5 build.txt

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/elets-salescall-ai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: elets-salescall-ai-apk
          path: mobile/build/elets-salescall-ai.apk
          retention-days: 30

      - name: Publish "android-latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest build/elets-salescall-ai.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android build (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Default server: $API_BASE_URL (changeable on the sign-in screen). Install: open this page on the phone, download elets-salescall-ai.apk, allow installs from the browser when Android asks."
