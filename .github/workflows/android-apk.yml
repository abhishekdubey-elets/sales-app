# Builds the Android APK on every push to main that touches the app (or on demand) and publishes it as the
# "android-latest" release, so it can be installed from:
#   https://github.com/<owner>/<repo>/releases/download/android-latest/elets-salescall-ai.apk
#
# Default server baked into the app: repository variable API_BASE_URL (Settings → Secrets and variables →
# Actions → Variables). Users can still change the server on the sign-in screen.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL != '' && vars.API_BASE_URL || 'http://10.0.0.172:8010' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/elets-salescall-ai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: elets-salescall-ai-apk
          path: mobile/build/elets-salescall-ai.apk
          retention-days: 30

      - name: Publish "android-latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest build/elets-salescall-ai.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android build (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Default server: $API_BASE_URL (changeable on the sign-in screen). Install: open this page on the phone, download elets-salescall-ai.apk, allow installs from the browser when Android asks."
